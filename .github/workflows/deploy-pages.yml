name: Deploy web app (GitHub Pages)
# Every push that touches www/ publishes the new HTML. The installed APK loads the app from this
# site, so all users get the update the next time they open ResultSpace — no new APK needed.
on:
  push:
    branches: [ main ]
    paths: [ 'www/**', '.github/workflows/deploy-pages.yml' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
