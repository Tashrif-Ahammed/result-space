name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Decodes the release keystore (stored as a base64 GitHub secret) back into a real
      # .keystore file so Gradle can sign the release build with it. Same keystore every build
      # => same SHA-1 every build => Google Sign-In (and Firebase generally) keeps working, and
      # the APK is a proper non-debug release build instead of a randomly-signed debug one.
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Prints the SHA-1 the APK was ACTUALLY signed with, straight from the built file — the
      # fastest way to confirm it matches what's registered in Firebase Console if Google
      # Sign-In ever breaks again ("error 10 / DEVELOPER_ERROR" almost always means a mismatch).
      - name: Print release APK signing SHA-1
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | grep -A1 "SHA1:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultspace-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultspace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
